<div class="float"><a id="wa" target="_blank" rel="noopener" aria-label="Chat on WhatsApp"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg></a><a class="c" id="call" aria-label="Call us now"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></a></div>

<script>
/* ---- Page builder. You normally don't need to edit below this line. ---- */
const $=id=>document.getElementById(id), S=SITE, P=S.pages;
const wa=m=>`https://wa.me/${S.phoneRaw}?text=${encodeURIComponent(m)}`;
const pg=(g)=>Object.entries(P).filter(([k,v])=>v.group===g).map(([k,v])=>({t:v.title,h:k}));
const MENU=[{t:"Home",h:"home"},{t:"Corporate",h:"about",kids:pg("Corporate")},
 {t:"Franchise",h:"franchise",kids:[...pg("Franchise"),{t:"How to start",h:"franchise"},{t:"Margin calculator",h:"calculator"}]},
 {t:"Products",h:"products",kids:S.categories.map(c=>({t:c,h:"products/"+c}))},{t:"Gallery",h:"gallery"},{t:"Contact Us",h:"contact"}];
$("th").textContent=S.hours; $("tc").textContent=S.phone+"  |  "+S.email;
$("logo").innerHTML=S.logoA+"<span>"+S.logoB+"</span>";
$("nav").innerHTML=MENU.map(m=>m.kids?`<div class="dd"><a class="has" href="#${m.h}">${m.t}</a><div class="menu">${m.kids.map(k=>`<a href="#${k.h}">${k.t}</a>`).join("")}</div></div>`:`<a href="#${m.h}">${m.t}</a>`).join("")+`<a class="btn" href="#contact">Enquire now</a>`;
$("burger").onclick=()=>{const open=$("nav").classList.toggle("open");$("burger").setAttribute("aria-expanded",String(open))};
$("wa").href=wa("Hello, I want to know about your PCD franchise."); $("call").href="tel:+"+S.phoneRaw;

const form=(t="Check if your area is open")=>`<form class="form enq"><h3>${t}</h3><p>We reply within one working day.</p>
<label class="sr-only" for="enq-name">Your name</label><input id="enq-name" name="n" placeholder="Your name" autocomplete="name" maxlength="80" required>
<label class="sr-only" for="enq-phone">Mobile number</label><input id="enq-phone" name="p" type="tel" placeholder="Mobile number" autocomplete="tel" inputmode="tel" pattern="[0-9+() -]{7,20}" maxlength="20" required>
<label class="sr-only" for="enq-city">City or district</label><input id="enq-city" name="c" placeholder="City / District" autocomplete="address-level2" maxlength="80" required>
<label class="sr-only" for="enq-range">Interested product range</label><select id="enq-range" name="r"><option value="">Interested in (optional)</option>${S.categories.map(c=>`<option>${c}</option>`).join("")}</select><button class="btn" type="submit">Send on WhatsApp</button></form>`;
const banner=(t,crumb)=>`<div class="banner"><div class="wrap"><h1>${t}</h1><p><a href="#home">Home</a> / ${crumb||t}</p></div></div>`;
const prod=l=>`<div class="grid">${l.map(p=>`<div class="card"><small>${p.cat}</small><h3>${p.name}</h3><p>${p.salt}</p></div>`).join("")||"<p>Products coming soon.</p>"}</div>`;
const catCards=()=>`<div class="grid">${S.categories.map(c=>`<a class="cat" href="#products/${c}"><div class="tile">${c[0]}</div><div>${c}</div></a>`).join("")}</div>`;
const stepsHtml=()=>`<div class="steps">${S.steps.map(s=>`<div class="step"><h3>${s.t}</h3><p>${s.x}</p></div>`).join("")}</div>`;
const faqHtml=()=>S.faq.map(f=>`<details><summary>${f.q}</summary><p>${f.a}</p></details>`).join("");
const certs=()=>{const verified=S.certs.filter(c=>c.t&&c.s&&!/add |\[add/i.test(c.s));return verified.length?`<div class="badges">${verified.map(c=>`<div class="badge"><b>${c.t}</b><small>${c.s}</small></div>`).join("")}</div>`:""};
const partnerLane=()=>`<section class="partner-lane"><div class="wrap"><div><span class="eyebrow">A clearer first step</span><h2>Built for people ready to grow a medicine business.</h2><p class="lead">Tell us where you operate. We’ll first confirm territory availability, then discuss the product mix and documents that fit your plan.</p></div><div class="partner-types"><div><span>01</span><b>Distributors</b><small>Expand a defined territory</small></div><div><span>02</span><b>Medical professionals</b><small>Build a trusted local range</small></div><div><span>03</span><b>Entrepreneurs</b><small>Start with guided support</small></div></div></div></section>`;
const territoryPanel=()=>`<section class="territory"><div class="wrap"><div class="territory-copy"><span class="eyebrow">Territory-first partnership</span><h2>Your district deserves a focused plan.</h2><p>Availability, product mix and required documentation are clarified before you commit—so every next step is practical.</p></div><div class="territory-actions"><div><span class="territory-no">01</span><b>Share your district</b><small>Tell us where you plan to operate.</small></div><div><span class="territory-no">02</span><b>Check availability</b><small>We confirm the current territory status.</small></div><a class="btn" href="#contact">Check my area <span aria-hidden="true">→</span></a></div></div></section>`;
const blocks=b=>b.map(x=>x.cards?`<div class="grid">${x.cards.map(c=>`<div class="card"><h3>${c.t}</h3><p>${c.x}</p></div>`).join("")}</div>`:
 `${x.h?`<h2>${x.h}</h2>`:""}${x.p?`<p>${x.p}</p>`:""}${x.list?`<ul>${x.list.map(i=>`<li>${i}</li>`).join("")}</ul>`:""}`).join("");
const band=()=>`<div class="band"><div class="wrap"><h2>Ready to start your franchise?</h2><p>Tell us your city and we will confirm availability.</p><a class="btn" href="#contact">Get in touch</a></div></div>`;

const R={
home:()=>`<div class="hero"><div class="wrap"><div><h1>${S.tagline}</h1><p>${S.heroText}</p>
<ul class="ticks">${S.heroPoints.map(p=>`<li>${p}</li>`).join("")}</ul><div class="cta"><a class="btn" href="#products">Explore products</a><a class="btn line" href="#franchise">Franchise details</a></div></div>${form()}</div></div>
<div class="trust"><div class="wrap">${S.stats.map(s=>`<div><b>${s.v}</b><span>${s.l}</span></div>`).join("")}</div></div>
<section><div class="wrap split"><div><span class="eyebrow">The Aurevite standard</span><h2>Made for a stronger start in your market.</h2><p class="lead">${P.about.blocks[0].p}</p><a class="btn" href="#about">Read our story <span aria-hidden="true">→</span></a>${certs()}</div>
<div class="pic">Add your factory or office photo (see Gallery in the edit area)</div></div></section>
${territoryPanel()}${partnerLane()}
<section class="alt"><div class="wrap"><span class="eyebrow">Explore by format</span><h2>Build the range your market needs.</h2><p class="lead">Select a product category to explore sample formulations.</p>${catCards()}</div></section>
<section><div class="wrap"><span class="eyebrow">Partnership, made practical</span><h2>What you get beyond the product.</h2><p class="lead">Clear support at the points that matter when you are building local demand.</p><div class="grid">${S.why.map(w=>`<div class="card"><h3>${w.t}</h3><p>${w.x}</p></div>`).join("")}</div></div></section>
<section class="alt"><div class="wrap"><h2>Start in four steps</h2><p class="lead">From first call to first order.</p>${stepsHtml()}</div></section>
${S.reviews.some(r=>r.q&&!/^Paste a /i.test(r.q))?`<section><div class="wrap"><h2>What our partners say</h2><p class="lead">Real feedback from the people we work with.</p><div class="grid">${S.reviews.filter(r=>r.q&&!/^Paste a /i.test(r.q)).map(r=>`<div class="card quote">“${r.q}”<cite>${r.n}</cite></div>`).join("")}</div></div></section>`:""}
<section class="alt"><div class="wrap"><h2>Common questions</h2><p class="lead">Quick answers before you call.</p>${faqHtml()}</div></section>${band()}`,
products:a=>a?`${banner(a,"Products / "+a)}<section><div class="wrap"><h2>${a}</h2><p class="lead">Sample products. Full list and rate card on request.</p>${prod(S.products.filter(p=>p.cat===a))}</div></section>${band()}`
 :`${banner("Our Products")}<section><div class="wrap"><h2>Choose a category</h2><p class="lead">Browse sample products by category.</p>${catCards()}</div></section>${band()}`,
franchise:()=>`${banner(P.franchise.title)}<section><div class="wrap split"><div class="prose">${blocks(P.franchise.blocks)}</div>${form("Apply for a franchise")}</div></section>
<section class="alt"><div class="wrap"><h2>How to start</h2><p class="lead">Four simple steps.</p>${stepsHtml()}</div></section><section><div class="wrap"><h2>Franchise FAQ</h2>${faqHtml()}</div></section>`,
calculator:()=>`${banner("Margin Calculator","Franchise / Margin Calculator")}<section><div class="wrap split calc"><div><h2>Check your margin</h2><p class="lead">Enter the MRP and your purchase rate.</p>
<label>MRP (₹)</label><input id="mrp" type="number" value="100" min="0"><label>Your purchase rate (₹)</label><input id="rate" type="number" value="60" min="0"></div>
<div class="result"><span>Your margin</span><b id="mp">40%</b><span id="ma">₹40.00 per unit</span></div></div></section>`,
gallery:()=>`${banner("Gallery")}<section><div class="wrap"><h2>Our facility and team</h2><p class="lead">Add your own photos: put image files in a folder called images and list them in the edit area.</p>
<div class="grid gal">${(S.gallery||["Facility","Packing","Laboratory","Team","Warehouse","Events"]).map(g=>g.includes(".")?`<div class="pic" style="background-image:url(${g})"></div>`:`<div class="pic">${g}<br>(photo here)</div>`).join("")}</div></div></section>`,
contact:()=>`${banner("Contact Us")}<section><div class="wrap split"><div class="prose"><h2>Get in touch</h2><p><b>${S.company}</b><br>${S.address}</p><p>Phone: <a href="tel:+${S.phoneRaw}">${S.phone}</a><br>Email: <a href="mailto:${S.email}">${S.email}</a><br>${S.hours}</p>
${S.mapEmbed?`<iframe src="${S.mapEmbed}" style="width:100%;height:260px;border:0;border-radius:12px" loading="lazy" title="Map"></iframe>`:""}</div>${form("Send us an enquiry")}</div></section>`
};
Object.keys(P).filter(k=>k!=="franchise").forEach(k=>R[k]=()=>`${banner(P[k].title,P[k].group+" / "+P[k].title)}<section><div class="wrap prose">${blocks(P[k].blocks)}</div></section>${band()}`);

function route(){const[h,a]=(location.hash.slice(1)||"home").split("/");const f=Object.prototype.hasOwnProperty.call(R,h)?R[h]:R.home;
 const raw=(()=>{try{return decodeURIComponent(a||"")}catch{return ""}})();
 const safeCategory=S.categories.includes(raw)?raw:"";$("app").innerHTML=f(safeCategory);
 document.title=(P[h]?P[h].title+" | ":"")+S.company;scrollTo(0,0);$("nav").classList.remove("open");fx();}
/* ---- Interactive effects (reveal on scroll, count-up numbers, card tilt, hero spotlight) ---- */
const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
let pointerFrame=0, pendingPointer;
document.addEventListener("pointermove",e=>{
 if(still||e.pointerType==="touch")return;pendingPointer=e;if(pointerFrame)return;
 pointerFrame=requestAnimationFrame(()=>{pointerFrame=0;const p=pendingPointer, target=p.target.closest&&p.target.closest(".hero,a.cat");if(!target)return;
  const r=target.getBoundingClientRect(),x=((p.clientX-r.left)/r.width*100).toFixed(1)+"%",y=((p.clientY-r.top)/r.height*100).toFixed(1)+"%";
  if(target.classList.contains("hero")){target.style.setProperty("--cursor-x",x);target.style.setProperty("--cursor-y",y)}
  else {const tile=target.querySelector(".tile");if(tile){tile.style.setProperty("--tile-x",x);tile.style.setProperty("--tile-y",y)}}
 })});
function initCursorTrail(){
 if(still||!matchMedia("(hover:hover) and (pointer:fine)").matches)return;
 const trail=document.createElement("div");trail.className="cursor-trail";trail.setAttribute("aria-hidden","true");
 const dots=Array.from({length:6},()=>{const dot=document.createElement("i");trail.append(dot);return{x:-80,y:-80,el:dot}});document.body.append(trail);
 let targetX=-80,targetY=-80,trailFrame=0,started=false;
 const render=()=>{trailFrame=requestAnimationFrame(render);dots.forEach((dot,index)=>{const leader=index?dots[index-1]:{x:targetX,y:targetY};const easing=index?0.15:0.22;dot.x+=(leader.x-dot.x)*easing;dot.y+=(leader.y-dot.y)*easing;dot.el.style.transform=`translate3d(${(dot.x-8).toFixed(1)}px,${(dot.y-8).toFixed(1)}px,0)`})};
 document.addEventListener("pointermove",e=>{if(e.pointerType==="touch")return;targetX=e.clientX;targetY=e.clientY;if(!started){started=true;trail.classList.add("active");render()}},{passive:true});
 addEventListener("blur",()=>trail.classList.remove("active"));addEventListener("focus",()=>{if(started)trail.classList.add("active")});
}
initCursorTrail();
function fx(){
 if(still||!("IntersectionObserver" in window))return;
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add("in");io.unobserve(e.target);
  const b=e.target.querySelector&&e.target.querySelector(".trust b, b");if(e.target.closest(".trust")&&b&&!b.dataset.done){b.dataset.done=1;count(b)}}),{threshold:.15});
 document.querySelectorAll(".card,.step,a.cat,.badge,details,.pic,.trust .wrap>div,.form").forEach((el,i)=>{el.classList.add("rv");el.style.transitionDelay=(i%6)*70+"ms";io.observe(el)});
}
function count(el){const m=el.textContent.match(/^(\d+)(.*)$/);if(!m)return;const n=+m[1],t0=performance.now();
 (function f(t){const p=Math.min((t-t0)/1200,1);el.textContent=Math.round(n*(1-Math.pow(1-p,3)))+m[2];if(p<1)requestAnimationFrame(f)})(t0)}
addEventListener("hashchange",route);route();
document.addEventListener("submit",e=>{if(!e.target.classList.contains("enq"))return;e.preventDefault();if(!e.target.checkValidity()){e.target.reportValidity();return}const f=new FormData(e.target);
 const value=n=>String(f.get(n)||"").trim().slice(0,80);open(wa(`Franchise enquiry\nName: ${value("n")}\nPhone: ${value("p")}\nCity: ${value("c")}\nInterested in: ${value("r")||"Any"}`),"_blank","noopener,noreferrer")});
document.addEventListener("input",e=>{if(e.target.id!=="mrp"&&e.target.id!=="rate")return;const m=+$("mrp").value,r=+$("rate").value;
 $("mp").textContent=m>0?((m-r)/m*100).toFixed(1)+"%":"0%";$("ma").textContent="₹"+(m-r).toFixed(2)+" per unit"});
$("foot").innerHTML=`<div><h3>${S.company}</h3><p>${S.tagline}.</p></div><div><h3>Company</h3>${pg("Corporate").map(k=>`<a href="#${k.h}">${k.t}</a>`).join("")}</div>
<div><h3>Products</h3>${S.categories.map(c=>`<a href="#products/${c}">${c}</a>`).join("")}</div><div><h3>Contact</h3><p>${S.address}<br>${S.phone}<br>${S.email}</p>${Object.entries(S.social).map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${n}</a>`).join("")}</div>`;
$("legal").textContent=`© ${new Date().getFullYear()} ${S.company}. All rights reserved.`;
</script>
</body>
</html>
