$("nav").innerHTML=MENU.map(m=>m.kids?`<div class="dd"><a class="has" href="#${m.h}">${m.t}</a><div class="menu">${m.kids.map(k=>`<a href="#${k.h}">${k.t}</a>`).join("")}</div></div>`:`<a href="#${m.h}">${m.t}</a>`).join("")+`<a class="btn" href="#contact">Enquire now</a>`;

$("wa").href=wa("Hello, I want to know about your PCD franchise."); $("call").href="tel:+"+S.phoneRaw;

const form=(t="Check if your area is open")=>`<form class="form enq"><h3>${t}</h3><p>We reply within one working day.</p>
<input name="n" placeholder="Your name" required><input name="p" type="tel" placeholder="Mobile number" required><input name="c" placeholder="City / District" required>
<select name="r"><option value="">Interested in (optional)</option>${S.categories.map(c=>`<option>${c}</option>`).join("")}</select><button class="btn">Send on WhatsApp</button></form>`;
const banner=(t,crumb)=>`<div class="banner"><div class="wrap"><h1>${t}</h1><p><a href="#home">Home</a> / ${crumb||t}</p></div></div>`;
const prod=l=>`<div class="grid">${l.map(p=>`<div class="card"><small>${p.cat}</small><h3>${p.name}</h3><p>${p.salt}</p></div>`).join("")||"<p>Products coming soon.</p>"}</div>`;
const catCards=()=>`<div class="grid">${S.categories.map(c=>`<a class="cat" href="#products/${c}"><div class="tile">${c[0]}</div><div>${c}</div></a>`).join("")}</div>`;
const stepsHtml=()=>`<div class="steps">${S.steps.map(s=>`<div class="step"><h3>${s.t}</h3><p>${s.x}</p></div>`).join("")}</div>`;
const faqHtml=()=>S.faq.map(f=>`<details><summary>${f.q}</summary><p>${f.a}</p></details>`).join("");
const certs=()=>`<div class="badges">${S.certs.map(c=>`<div class="badge"><b>${c.t}</b><small>${c.s}</small></div>`).join("")}</div>`;
const blocks=b=>b.map(x=>x.cards?`<div class="grid">${x.cards.map(c=>`<div class="card"><h3>${c.t}</h3><p>${c.x}</p></div>`).join("")}</div>`:
 `${x.h?`<h2>${x.h}</h2>`:""}${x.p?`<p>${x.p}</p>`:""}${x.list?`<ul>${x.list.map(i=>`<li>${i}</li>`).join("")}</ul>`:""}`).join("");
const band=()=>`<div class="band"><div class="wrap"><h2>Ready to start your franchise?</h2><p>Tell us your city and we will confirm availability.</p><a class="btn" href="#contact">Get in touch</a></div></div>`;

const R={
home:()=>`<div class="hero"><div class="wrap"><div><h1>${S.tagline}</h1><p>${S.heroText}</p>
<ul class="ticks">${S.heroPoints.map(p=>`<li>${p}</li>`).join("")}</ul><div class="cta"><a class="btn" href="#products">Explore products</a><a class="btn line" href="#franchise">Franchise details</a></div></div>${form()}</div></div>
<div class="trust"><div class="wrap">${S.stats.map(s=>`<div><b>${s.v}</b><span>${s.l}</span></div>`).join("")}</div></div>
<section><div class="wrap split"><div><h2>About ${S.company}</h2><p class="lead">${P.about.blocks[0].p}</p><a class="btn" href="#about">Read our story</a>${certs()}</div>
<div class="pic">Add your factory or office photo (see Gallery in the edit area)</div></div></section>
<section class="alt"><div class="wrap"><h2>Our product range</h2><p class="lead">Select a category to see sample products.</p>${catCards()}</div></section>
<section><div class="wrap"><h2>Why partners choose us</h2><p class="lead">What you can expect when you work with us.</p><div class="grid">${S.why.map(w=>`<div class="card"><h3>${w.t}</h3><p>${w.x}</p></div>`).join("")}</div></div></section>
<section class="alt"><div class="wrap"><h2>Start in four steps</h2><p class="lead">From first call to first order.</p>${stepsHtml()}</div></section>
<section><div class="wrap"><h2>What our partners say</h2><p class="lead">Real feedback from the people we work with.</p><div class="grid">${S.reviews.map(r=>`<div class="card quote">“${r.q}”<cite>${r.n}</cite></div>`).join("")}</div></div></section>
<section class="alt"><div class="wrap"><h2>Common questions</h2><p class="lead">Quick answers before you call.</p>${faqHtml()}</div></section>${band()}`,
products:a=>a?`${banner(a,"Products / "+a)}<section><div class="wrap"><h2>${a}</h2><p class="lead">Sample products. Full list and rate card on request.</p>${prod(S.products.filter(p=>p.cat===a))}</div></section>${band()}`
 :`${banner("Our Products")}<section><div class="wrap"><h2>Choose a category</h2><p class="lead">Browse sample products by category.</p>${catCards()}</div></section>${band()}`,
franchise:()=>`${banner(P.franchise.title)}<section><div class="wrap split"><div class="prose">${blocks(P.franchise.blocks)}</div>${form("Apply for a franchise")}</div></section>
<section class="alt"><div class="wrap"><h2>How to start</h2><p class="lead">Four simple steps.</p>${stepsHtml()}</div></section><section><div class="wrap"><h2>Franchise FAQ</h2>${faqHtml()}</div></section>`,
calculator:()=>`${banner("Margin Calculator","Franchise / Margin Calculator")}<section><div class="wrap split calc"><div><h2>Check your margin</h2><p class="lead">Enter the MRP and your purchase rate.</p>
<label>MRP (₹)</label><input id="mrp" type="number" value="100" min="0"><label>Your purchase rate (₹)</label><input id="rate" type="number" value="60" min="0"></div>
<div class="result"><span>Your margin</span><b id="mp">40%</b><span id="ma">₹40.00 per unit</span></div></div></section>`,
gallery:()=>`${banner("Gallery")}<section><div class="wrap"><h2>Our facility and team</h2><p class="lead">Add your own photos: put image files in a folder called images and list them in the edit area.</p>
<div class="grid gal">${(S.gallery||["Facility","Packing","Laboratory","Team","Warehouse","Events"]).map(g=>g.includes(".")?`<div class="pic" style="background-image:url(${g})"></div>`:`<div class="pic">${g}<br>(photo here)</div>`).join("")}</div></div></section>`,
contact:()=>`${banner("Contact Us")}<section><div class="wrap split"><div class="prose"><h2>Get in touch</h2><p><b>${S.company}</b><br>${S.address}</p><p>Phone: <a href="tel:+${S.phoneRaw}">${S.phone}</a><br>Email: <a href="mailto:${S.email}">${S.email}</a><br>${S.hours}</p>
${S.mapEmbed?`<iframe src="${S.mapEmbed}" style="width:100%;height:260px;border:0;border-radius:12px" loading="lazy" title="Map"></iframe>`:""}</div>${form("Send us an enquiry")}</div></section>`
};
Object.keys(P).filter(k=>k!=="franchise").forEach(k=>R[k]=()=>`${banner(P[k].title,P[k].group+" / "+P[k].title)}<section><div class="wrap prose">${blocks(P[k].blocks)}</div></section>${band()}`);

function route(){const[h,a]=(location.hash.slice(1)||"home").split("/");const f=R[h]||R.home;$("app").innerHTML=f(decodeURIComponent(a||""));
 document.title=(P[h]?P[h].title+" | ":"")+S.company;scrollTo(0,0);$("nav").classList.remove("open");fx();}
/* ---- Interactive effects (reveal on scroll, count-up numbers, card tilt, hero spotlight) ---- */
const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
function fx(){
 if(still||!("IntersectionObserver" in window))return;
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add("in");io.unobserve(e.target);
  const b=e.target.querySelector&&e.target.querySelector(".trust b, b");if(e.target.closest(".trust")&&b&&!b.dataset.done){b.dataset.done=1;count(b)}}),{threshold:.15});
 document.querySelectorAll(".card,.step,a.cat,.badge,details,.pic,.trust .wrap>div,.form").forEach((el,i)=>{el.classList.add("rv");el.style.transitionDelay=(i%6)*70+"ms";io.observe(el)});
}
function count(el){const m=el.textContent.match(/^(\d+)(.*)$/);if(!m)return;const n=+m[1],t0=performance.now();
 (function f(t){const p=Math.min((t-t0)/1200,1);el.textContent=Math.round(n*(1-Math.pow(1-p,3)))+m[2];if(p<1)requestAnimationFrame(f)})(t0)}
document.addEventListener("mousemove",e=>{
 if(still)return;const h=e.target.closest&&e.target.closest(".hero");if(h){const r=h.getBoundingClientRect();h.style.setProperty("--mx",e.clientX-r.left+"px");h.style.setProperty("--my",e.clientY-r.top+"px")}
 const c=e.target.closest&&e.target.closest(".card,.step,a.cat");if(c&&c.classList.contains("in")){const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  c.style.transitionDelay="0ms";c.style.transform=`perspective(700px) rotateX(${(-y*7).toFixed(1)}deg) rotateY(${(x*9).toFixed(1)}deg) translateY(-6px)`}});
document.addEventListener("mouseout",e=>{const c=e.target.closest&&e.target.closest(".card,.step,a.cat");if(c&&!c.contains(e.relatedTarget))c.style.transform=""});
addEventListener("hashchange",route);route();
document.addEventListener("submit",e=>{if(!e.target.classList.contains("enq"))return;e.preventDefault();const f=new FormData(e.target);
 open(wa(`Franchise enquiry\nName: ${f.get("n")}\nPhone: ${f.get("p")}\nCity: ${f.get("c")}\nInterested in: ${f.get("r")||"Any"}`),"_blank")});
document.addEventListener("input",e=>{if(e.target.id!=="mrp"&&e.target.id!=="rate")return;const m=+$("mrp").value,r=+$("rate").value;
 $("mp").textContent=m>0?((m-r)/m*100).toFixed(1)+"%":"0%";$("ma").textContent="₹"+(m-r).toFixed(2)+" per unit"});
$("foot").innerHTML=`<div><h3>${S.company}</h3><p>${S.tagline}.</p></div><div><h3>Company</h3>${pg("Corporate").map(k=>`<a href="#${k.h}">${k.t}</a>`).join("")}</div>
<div><h3>Products</h3>${S.categories.map(c=>`<a href="#products/${c}">${c}</a>`).join("")}</div><div><h3>Contact</h3><p>${S.address}<br>${S.phone}<br>${S.email}</p>${Object.entries(S.social).map(([n,u])=>`<a href="${u}">${n}</a>`).join("")}</div>`;
$("legal").textContent=`© ${new Date().getFullYear()} ${S.company}. All rights reserved.`;
</script>
</body>
</html>
